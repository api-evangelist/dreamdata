notes: >-
  Two officially documented server-side SDKs (Node.js, Go) and two first-party CDN-delivered
  browser surfaces. The strongest currency finding is decay on the Node.js side: the SDK the
  2026 docs tell developers to install last shipped in 2022, and its upstream GitHub repo is
  archived; the newer browser library (@dreamdata/analytics-next, 2024) is not referenced from
  the docs at all. Dreamdata publishes no SDK for the MCP server — it is a remote HTTP server
  reached over OAuth, with no client package.
