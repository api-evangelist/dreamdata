apis:
- name: Dreamdata Event Tracking API
  description: >-
    Segment-compatible event tracking API for capturing B2B customer journey events.
    Server-side events are POSTed as a batch to the HTTP endpoint with HTTP Basic auth
    (source API key as username, empty password); a client-side JavaScript library exposes
    track, page, identify, group, and alias methods. Payloads are limited to 500kb per
    request and each event carries a unique messageId, a userId/anonymousId, and an ISO 8601
    timestamp.
  humanURL: https://developer.dreamdata.io/server-side/server-side-tracking/
