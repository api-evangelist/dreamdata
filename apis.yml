aid: dreamdata
name: Dreamdata
description: >-
  Dreamdata is a B2B revenue attribution and go-to-market data platform founded in
  2018 in Copenhagen. It connects every marketing and sales touchpoint — from anonymous
  web visits and ad clicks to CRM opportunities and closed-won revenue — into one clean,
  account-based customer journey data model. The platform delivers multi-touch attribution,
  pipeline and revenue analytics, AI-powered audience building, and activation that syncs
  audiences to ad networks and downstream tools. For developers Dreamdata exposes a
  Segment-compatible event tracking API (client-side JavaScript and a server-side HTTP
  batch endpoint), a data warehouse model, outbound webhook syncs, first-party Node.js and
  Go SDKs, and a hosted remote MCP server secured with OAuth 2.1 PKCE for agent access.
