format: http-status
format_note: >-
  Dreamdata publishes no RFC 9457 problem+json catalog and no numeric application error
  registry. What it does publish is a short troubleshooting table for the MCP server keyed on
  HTTP status, plus one literal server message. Everything below is transcribed from the
  provider's own pages or observed on a live anonymous request; nothing is inferred.
surfaces:
- surface: MCP server
  endpoint: https://mcp.dreamdata.io/mcp
  envelope: >-
    JSON body {"error": "...", "error_description": "..."} on the auth path, alongside an
    RFC 6750 WWW-Authenticate: Bearer challenge carrying resource_metadata.
- surface: Event Tracking API
  endpoint: https://api.dreamdata.cloud/v1/batch
  envelope: >-
    Not documented. The docs describe request shape and the 500kb batch ceiling but publish no
    error reference, no error body schema and no status-code table for the batch endpoint.
problems:
- code: 401
  status: 401
  surface: MCP server
  title: Unauthorized
  detail: Your session has expired or the token is invalid.
  remediation: Disconnect and reconnect the connector to re-authenticate.
