api_access:
  note: >-
    Pricing is packaged by platform capability, not by API. The pricing page does not price or
    gate the Event Tracking API, the outbound webhook syncs or the MCP server separately, and
    does not say which tier the MCP server requires — the MCP docs only state it must be
    "enabled for this user" by the account owner. Free-tier "Syncs: 1" is the only published
    limit that touches the outbound webhook surface.
notes: >-
  Two tiers only: a genuinely self-serve free plan with published numeric limits, and a
  contact-sales tier with no published price. No published per-seat rate, no overage rate, and
  no MTU thresholds — so the money question above the free tier is a sales conversation.
